name: Build Apple Silicon VST3
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Configure Apple Silicon
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - name: Test DSP, state and editor
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Ad-hoc sign and archive
        run: |
          codesign --force --deep --sign - "build/LUFSCompensation_artefacts/Release/VST3/LUFS Compensation.vst3"
          mkdir -p dist/LUFS-Compensation
          ditto "build/LUFSCompensation_artefacts/Release/VST3/LUFS Compensation.vst3" "dist/LUFS-Compensation/LUFS Compensation.vst3"
          cp scripts/LUFS-Reference.jsfx docs/REAPER.md dist/LUFS-Compensation/
          ditto -c -k --sequesterRsrc --keepParent dist/LUFS-Compensation LUFS-Compensation-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LUFS-Compensation-macOS-arm64
          path: LUFS-Compensation-macOS-arm64.zip
